# Field deployment, Windows: one container per team, each its own
# published port, using ordinary bridge networking -- Docker Desktop's
# WSL2 backend does not reliably support host networking, and even when
# it works does not behave the way loopback detection needs it to (every
# connection into a published port, loopback or genuinely remote, NATs
# through the same internal gateway address, so client-IP checks cannot
# tell them apart here at all).
#
# Each team's admin port is published as "127.0.0.1:hostport:8100" --
# Docker/Windows only listens for that forwarded port on the host's own
# loopback interface, a real socket-level restriction enforced before
# traffic ever reaches Docker's internal forwarding, unaffected by the
# NAT confusion above. /dm only answers on that port (see
# cybergame/server.py's restrict_dm_to_admin_port). The container's own
# internal admin port can be the same fixed value (8100) for every team
# since each container is an isolated network namespace -- only the
# host-side numbers need to be unique, to avoid colliding with each
# other on this one machine.
#
# Do not edit this to match docker-compose.lan.yml exactly, and do not
# edit docker-compose.lan.yml to match this -- they solve the same
# networking problem two different ways for two different platforms.
services:
  team-alpha:
    image: cadet-cyber-game-lan:latest
    container_name: team-alpha
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "127.0.0.1:8100:8100"
    environment:
      - ADMIN_PORT=8100
      - ADMIN_BIND_HOST=0.0.0.0
    volumes:
      - ./scenario:/app/scenario:ro

  team-bravo:
