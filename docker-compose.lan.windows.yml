# Windows-specific field deployment. Identical in intent to
# docker-compose.lan.yml (Linux), but uses per-team published ports
# instead of network_mode: host -- Docker Desktop's WSL2 backend does not
# reliably support host networking the way native Linux does (it's an
# opt-in Docker Desktop setting, and even then does not behave the same
# way loopback detection needs it to). Published ports via Docker
# Desktop's WSL2 forwarding are the well-supported, always-on path on
# Windows.
#
# Do not edit this to match docker-compose.lan.yml exactly, and do not
# edit docker-compose.lan.yml to match this -- they solve the same
# networking problem two different ways for two different platforms.
services:
  team-alpha:
    image: cadet-cyber-game-lan:latest
    container_name: team-alpha
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./scenario:/app/scenario:ro

  team-bravo:
    image: cadet-cyber-game-lan:latest
