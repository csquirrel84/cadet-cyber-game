<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cadet cyber game</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1 id="title">Operation Blackout</h1>
  <div>
    <span id="phase">briefing</span>
    &nbsp;&nbsp;
    <span id="clock">0:00</span>
  </div>
</header>

<div id="meters">
  <div class="meter">
    <div class="meter-label"><span>noise</span><span id="noise-num">0 / 10</span></div>
    <div class="meter-bar" id="noise-bar"><div class="meter-fill noise-fill" id="noise-fill" style="width:0%"></div></div>
  </div>
  <div class="meter">
    <div class="meter-label"><span>trace</span><span id="trace-num">0 / 10</span></div>
    <div class="meter-bar" id="trace-bar"><div class="meter-fill trace-fill" id="trace-fill" style="width:0%"></div></div>
  </div>
</div>

<div id="map">
  <div id="map-viewport">
    <div id="map-bg"></div>
    <svg id="island-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <g id="island-tiles"></g>
      <path id="river-bank" class="river-bank"/>
      <path id="river-water" class="river-water"/>
      <path id="tributary-bank" class="tributary-bank"/>
      <path id="tributary-water" class="tributary-water"/>
      <g id="river-detail"></g>
      <g id="foam"></g>
      <g id="forest"></g>
      <g id="powerlines"></g>
      <g id="vehicles"></g>
      <g id="roads-paved"></g>
      <g id="city-blocks"></g>
      <g id="airstrip"></g>
      <g id="dock"></g>
      <g id="flags"></g>
    </svg>
    <svg id="overlay-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="map-nodes"></div>
  </div>
  <div id="zoom-controls">
    <button id="zoom-in" aria-label="zoom in">+</button>
    <button id="zoom-reset" aria-label="reset zoom">&#x25a2;</button>
    <button id="zoom-out" aria-label="zoom out">&minus;</button>
  </div>
  <button id="legend-toggle" aria-label="toggle legend">LEGEND</button>
  <div id="legend-pinned"></div>
</div>

<div id="term-wrap">
  <div id="term"></div>
</div>

<div id="input-row">
  <span id="prompt-label">operator@field:~$</span>
  <input id="cmd-input" autocomplete="off" spellcheck="false" placeholder="type help for commands">
</div>

<div id="roll-panel">
  <button id="roll-btn" disabled>ROLL</button>
  <div id="roll-result">-</div>
  <div style="flex:1"></div>
  <button id="start-btn">start operation</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
