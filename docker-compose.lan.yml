# Field deployment, Linux: one container per team, each its own port, all
# on the host's own network stack (network_mode: host). Each team also
# gets its own admin port (team port + 100) bound inside the container to
# 127.0.0.1 -- because of host networking that *is* the real host's own
# loopback, so the OS itself refuses to route anything arriving over the
# WiFi network to it. /dm only answers on that admin port (see
# cybergame/server.py's restrict_dm_to_admin_port), not by client IP --
# client-IP checks turned out to be unsafe on Windows (see
# docker-compose.lan.windows.yml), so this uses the same port-based
# mechanism for consistency even though the IP check alone would still
# have been fine here.
#
# Run via setup.sh, not directly -- that script also brings up the WiFi
# access point the team laptops connect to.
#
# Each team's game is a fully separate process with its own memory --
# nothing a team does is visible to any other team.
services:
  team-alpha:
    image: cadet-cyber-game-lan:latest
    container_name: team-alpha
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=8000
      - ADMIN_PORT=8100
      - ADMIN_BIND_HOST=127.0.0.1
    volumes:
      - ./scenario:/app/scenario:ro

  team-bravo:
    image: cadet-cyber-game-lan:latest
    container_name: team-bravo
    restart: unless-stopped
    network_mode: host
